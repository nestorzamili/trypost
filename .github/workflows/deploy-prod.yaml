name: TryPost Production Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode'
        type: choice
        required: true
        default: build-and-deploy
        options:
          - build-and-deploy
          - build-only
      public_host:
        description: 'Optional host override (e.g. post.example.com)'
        type: string
        required: false
        default: ''
      platform:
        description: 'Target image platform'
        type: choice
        required: true
        default: linux/amd64
        options:
          - linux/amd64
          - linux/arm64

permissions:
  contents: read
  packages: write

concurrency:
  group: trypost-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and push image
    runs-on: ${{ inputs.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 20
    outputs:
      image: ${{ steps.image.outputs.image }}
      compose_artifact: ${{ steps.image.outputs.compose_artifact }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set image reference
        id: image
        env:
          REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -eu
          SHORT_SHA="${GITHUB_SHA::7}"
          REGISTRY_IMAGE="${REGISTRY_IMAGE,,}"
          echo "image=$REGISTRY_IMAGE:$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "compose_artifact=trypost-compose-$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve public host
        id: public-host
        env:
          INPUT_HOST: ${{ inputs.public_host }}
          STORED_HOST: ${{ vars.TRYPOST_PUBLIC_HOST }}
        run: |
          set -eu

          # Per-run input wins; the repository variable is the fallback so the
          # variable never has to be edited just to target another host.
          host="${INPUT_HOST:-$STORED_HOST}"
          host="$(printf '%s' "$host" | tr '[:upper:]' '[:lower:]')"

          test -n "$host" || {
            echo "Public host is required: pass the public_host input or set the TRYPOST_PUBLIC_HOST repository variable" >&2
            exit 1
          }

          # Fail fast on values that would only break at runtime in the
          # browser: VITE_REVERB_HOST must be a bare hostname.
          case "$host" in
            *://*|*/*|*:*)
              echo "Public host must be a bare hostname without protocol, path or port (got '$host')" >&2
              exit 1
              ;;
          esac

          case "$host" in
            -*|.-*|*.|*-|*[!a-z0-9.-]*)
              echo "Public host contains invalid characters (got '$host')" >&2
              exit 1
              ;;
          esac

          echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: production
          platforms: ${{ inputs.platform }}
          push: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha,scope=prod-${{ inputs.platform }}
          cache-to: type=gha,mode=max,scope=prod-${{ inputs.platform }}
          build-args: |
            VITE_APP_NAME=TryPost
            VITE_REVERB_APP_KEY=trypost-reverb-key
            VITE_REVERB_HOST=${{ steps.public-host.outputs.host }}
            VITE_REVERB_PORT=443
            VITE_REVERB_SCHEME=https

      - name: Upload deployment manifest
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.image.outputs.compose_artifact }}
          path: compose.prod.yaml
          if-no-files-found: error
          retention-days: 7

      - name: Summarize run
        env:
          MODE: ${{ inputs.mode }}
          IMAGE: ${{ steps.image.outputs.image }}
          PUBLIC_HOST: ${{ steps.public-host.outputs.host }}
        run: |
          set -eu
          {
            echo "- Mode: \`$MODE\`"
            echo "- Image: \`$IMAGE\`"
            echo "- Public host: \`$PUBLIC_HOST\`"
            if [ "$MODE" = "build-only" ]; then
              echo "- Deploy manually: \`TRYPOST_IMAGE=$IMAGE docker compose --env-file .env -p trypost -f compose.prod.yaml up -d\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to VM
    needs: build
    if: ${{ inputs.mode == 'build-and-deploy' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Download deployment manifest
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.compose_artifact }}
          path: deployment

      - name: Copy deployment manifest to VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: deployment/compose.prod.yaml
          target: /opt/trypost
          overwrite: true
          strip_components: 1

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          TRYPOST_IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: TRYPOST_IMAGE,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -eu

            cd /opt/trypost

            test -f compose.prod.yaml || {
              echo "compose.prod.yaml is required at /opt/trypost/compose.prod.yaml" >&2
              exit 1
            }

            test -f .env || {
              echo ".env is required at /opt/trypost/.env" >&2
              exit 1
            }

            require_env() {
              key="$1"
              if ! grep -Eq "^${key}=.+" .env; then
                echo "$key must be set in .env" >&2
                exit 1
              fi
            }

            for key in APP_NAME APP_ENV APP_KEY APP_URL \
              DB_CONNECTION DB_HOST DB_PORT DB_DATABASE DB_USERNAME DB_PASSWORD \
              REDIS_HOST REDIS_PORT QUEUE_CONNECTION CACHE_STORE SESSION_DRIVER \
              BROADCAST_CONNECTION REVERB_APP_ID REVERB_APP_KEY REVERB_APP_SECRET \
              REVERB_HOST REVERB_PORT REVERB_SCHEME \
              PASSPORT_PRIVATE_KEY PASSPORT_PUBLIC_KEY; do
              require_env "$key"
            done

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
              --username "$GHCR_USERNAME" \
              --password-stdin

            compose() {
              TRYPOST_IMAGE="$TRYPOST_IMAGE" docker compose \
                --env-file .env \
                -p trypost \
                -f compose.prod.yaml \
                "$@"
            }

            compose config --quiet
            compose pull app
            compose up -d --wait --remove-orphans pgsql redis
            compose exec -T app php artisan horizon:terminate || true
            compose up -d --wait --no-deps --remove-orphans app

            ATTEMPT=0
            until curl --fail --silent --show-error \
              http://127.0.0.1:8000/up; do
              ATTEMPT=$((ATTEMPT + 1))

              if [ "$ATTEMPT" -ge 30 ]; then
                echo "TryPost health check failed after 60 seconds" >&2
                compose ps
                exit 1
              fi

              sleep 2
            done

            compose exec -T app php artisan horizon:status

            # Keep only the active TryPost image. Images from other repositories
            # and all PostgreSQL/Redis volumes are left untouched.
            IMAGE_REPOSITORY="${TRYPOST_IMAGE%:*}"
            CURRENT_IMAGE_ID="$(docker image inspect "$TRYPOST_IMAGE" --format '{{.Id}}')"
            docker image ls "$IMAGE_REPOSITORY" --format '{{.ID}}' | sort -u | while read -r IMAGE_ID; do
              if [ -n "$IMAGE_ID" ] && [ "$IMAGE_ID" != "$CURRENT_IMAGE_ID" ]; then
                docker image rm "$IMAGE_ID" || true
              fi
            done
