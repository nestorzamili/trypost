# TryPost — self-hosted production stack.
#
# Production values are kept in /opt/trypost/.env on the server. The
# deployment workflow passes that file explicitly; do not put secrets in this
# file or in the image.
#
# Manual start:
#   TRYPOST_IMAGE=ghcr.io/OWNER/REPO:SHA \
#     docker compose --env-file .env -p trypost -f compose.prod.yaml up -d
#
# This pulls the published image — no local build. PostgreSQL, Redis, the queue
# workers, the scheduler and the WebSocket server all run for you.

services:
  app:
    image: ${TRYPOST_IMAGE:?TRYPOST_IMAGE is required}
    container_name: trypost
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TRYPOST_TARGET: production
    ports:
      - "127.0.0.1:8000:80"     # host Nginx -> app
      - "127.0.0.1:8080:8080"   # host Nginx -> Reverb WebSocket
    volumes:
      - storage:/var/www/html/storage/app
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy

  pgsql:
    image: postgres:16-alpine
    container_name: trypost-pgsql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:?DB_USERNAME is required} -d ${DB_DATABASE:?DB_DATABASE is required}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trypost-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # Optional reverse proxy with automatic HTTPS (Let's Encrypt).
  # To serve on a domain:
  #   1. Point the domain's DNS at this host.
  #   2. Set APP_DOMAIN below and APP_URL above to https://<that domain>.
  #   3. Start with the proxy profile:
  #        docker compose -f compose.prod.yaml --profile proxy up -d
  # Without the profile, the app is served directly on http://localhost:8000.
  caddy:
    image: caddy:2-alpine
    container_name: trypost-caddy
    restart: unless-stopped
    profiles: [proxy]
    environment:
      APP_DOMAIN: post.example.com    # <- your domain
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  pgdata:
  redisdata:
  storage:
  caddy-data:
  caddy-config:
